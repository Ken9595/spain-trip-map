<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 03｜Toledo(托雷多) Travel Photo Album</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #111827;
    }
    body {
      margin: 0;
      padding: 14px;
      background: #f8fafc;
    }
    .album {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      width: 100%;
      min-height: 280px;
    }
    .panel {
      min-width: 0;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .panel img {
      width: 100%;
      height: 240px;
      display: block;
      object-fit: cover;
      background: #e5e7eb;
    }
    .caption {
      padding: 10px 12px 12px;
      line-height: 1.45;
    }
    .label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #9a3412;
      margin-bottom: 4px;
    }
    .location .label {
      color: #1d4ed8;
    }
    .title {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #111827;
    }
    .meta {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: #4b5563;
    }
    @media (max-width: 560px) {
      body {
        padding: 10px;
      }
      .album {
        gap: 10px;
      }
      .panel img {
        height: 170px;
      }
      .caption {
        padding: 8px 9px 10px;
      }
      .title {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="album" aria-label="Day 03｜Toledo(托雷多) rotating photo album">
    <section class="panel daily">
      <img id="dailyPhoto" alt="Day 03｜Toledo(托雷多) daily selected photo">
      <span class="caption">
        <span class="label">Daily Selected Photos</span>
        <span class="title">Day 03｜Toledo(托雷多)</span>
        <span class="meta">2026-04-24</span>
      </span>
    </section>
    <section class="panel location">
      <img id="locationPhoto" alt="Day 03｜Toledo(托雷多) location selected photo">
      <span class="caption">
        <span class="label">Location Photos</span>
        <span class="title">Toledo (托雷多) → Medieval Old Town (中世紀舊城) → Mirador del Valle (山谷觀景台)</span>
        <span class="meta">Changes every 2 seconds</span>
      </span>
    </section>
  </main>
  <script>
    const dailyPhotos = ["../assets/photos/day03_toledo_daily_002.jpg","../assets/photos/day03_toledo_daily_006.jpg","../assets/photos/day03_toledo_daily_009.jpg","../assets/photos/day03_toledo_daily_010.jpg","../assets/photos/day03_toledo_daily_013.jpg","../assets/photos/day03_toledo_daily_018.jpg","../assets/photos/day03_toledo_daily_024.jpg","../assets/photos/day03_toledo_daily_025.jpg","../assets/photos/day03_toledo_daily_030.jpg","../assets/photos/day03_toledo_daily_036.jpg","../assets/photos/day03_toledo_daily_037.jpg","../assets/photos/day03_toledo_daily_043.jpg","../assets/photos/day03_toledo_daily_044.jpg","../assets/photos/day03_toledo_daily_049.jpg","../assets/photos/day03_toledo_daily_050.jpg","../assets/photos/day03_toledo_daily_051.jpg","../assets/photos/day03_toledo_daily_054.jpg","../assets/photos/day03_toledo_daily_055.jpg","../assets/photos/day03_toledo_daily_057.jpg","../assets/photos/day03_toledo_daily_058.jpg","../assets/photos/day03_toledo_daily_061.jpg"];
    const locationPhotos = ["../assets/photos/day03_toledo_location_001.jpg","../assets/photos/day03_toledo_location_003.jpg","../assets/photos/day03_toledo_location_004.jpg","../assets/photos/day03_toledo_location_005.jpg","../assets/photos/day03_toledo_location_007.jpg","../assets/photos/day03_toledo_location_008.jpg","../assets/photos/day03_toledo_location_011.jpg","../assets/photos/day03_toledo_location_012.jpg","../assets/photos/day03_toledo_location_014.jpg","../assets/photos/day03_toledo_location_015.jpg","../assets/photos/day03_toledo_location_016.jpg","../assets/photos/day03_toledo_location_017.jpg","../assets/photos/day03_toledo_location_019.jpg","../assets/photos/day03_toledo_location_020.jpg","../assets/photos/day03_toledo_location_021.jpg","../assets/photos/day03_toledo_location_022.jpg","../assets/photos/day03_toledo_location_023.jpg","../assets/photos/day03_toledo_location_026.jpg","../assets/photos/day03_toledo_location_027.jpg","../assets/photos/day03_toledo_location_028.jpg","../assets/photos/day03_toledo_location_029.jpg","../assets/photos/day03_toledo_location_031.jpg","../assets/photos/day03_toledo_location_032.jpg","../assets/photos/day03_toledo_location_033.jpg","../assets/photos/day03_toledo_location_034.jpg","../assets/photos/day03_toledo_location_035.jpg","../assets/photos/day03_toledo_location_038.jpg","../assets/photos/day03_toledo_location_039.jpg","../assets/photos/day03_toledo_location_040.jpg","../assets/photos/day03_toledo_location_041.jpg","../assets/photos/day03_toledo_location_042.jpg","../assets/photos/day03_toledo_location_045.jpg","../assets/photos/day03_toledo_location_046.jpg","../assets/photos/day03_toledo_location_047.jpg","../assets/photos/day03_toledo_location_048.jpg","../assets/photos/day03_toledo_location_052.jpg","../assets/photos/day03_toledo_location_053.jpg","../assets/photos/day03_toledo_location_056.jpg","../assets/photos/day03_toledo_location_059.jpg","../assets/photos/day03_toledo_location_060.jpg","../assets/photos/day03_toledo_location_062.jpg","../assets/photos/day03_toledo_location_063.jpg"];
    const dailyImage = document.getElementById("dailyPhoto");
    const locationImage = document.getElementById("locationPhoto");
    let dailyIndex = 0;
    let locationIndex = 0;

    function setPhoto(image, list, index) {
      if (!list.length) return index;
      image.src = list[index % list.length];
      return index + 1;
    }

    function rotate() {
      dailyIndex = setPhoto(dailyImage, dailyPhotos, dailyIndex);
      locationIndex = setPhoto(locationImage, locationPhotos, locationIndex);
    }

    rotate();
    window.setInterval(rotate, 2000);
  </script>
</body>
</html>
