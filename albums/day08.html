<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 08｜Sevilla (塞維亞) → Barcelona (巴塞隆納) → Montserrat (蒙塞拉特) Travel Photo Album</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #111827;
    }
    body {
      margin: 0;
      padding: 14px;
      background: #f8fafc;
    }
    .album {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      width: 100%;
      min-height: 280px;
    }
    .panel {
      min-width: 0;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .panel img {
      width: 100%;
      height: 240px;
      display: block;
      object-fit: cover;
      background: #e5e7eb;
    }
    .caption {
      padding: 10px 12px 12px;
      line-height: 1.45;
    }
    .label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #9a3412;
      margin-bottom: 4px;
    }
    .location .label {
      color: #1d4ed8;
    }
    .title {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #111827;
    }
    .meta {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: #4b5563;
    }
    @media (max-width: 560px) {
      body {
        padding: 10px;
      }
      .album {
        gap: 10px;
      }
      .panel img {
        height: 170px;
      }
      .caption {
        padding: 8px 9px 10px;
      }
      .title {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="album" aria-label="Day 08｜Sevilla (塞維亞) → Barcelona (巴塞隆納) → Montserrat (蒙塞拉特) rotating photo album">
    <section class="panel daily">
      <img id="dailyPhoto" alt="Day 08｜Sevilla (塞維亞) → Barcelona (巴塞隆納) → Montserrat (蒙塞拉特) daily selected photo">
      <span class="caption">
        <span class="label">Daily Selected Photos</span>
        <span class="title">Day 08｜Sevilla (塞維亞) → Barcelona (巴塞隆納) → Montserrat (蒙塞拉特)</span>
        <span class="meta">2026-04-29</span>
      </span>
    </section>
    <section class="panel location">
      <img id="locationPhoto" alt="Day 08｜Sevilla (塞維亞) → Barcelona (巴塞隆納) → Montserrat (蒙塞拉特) location selected photo">
      <span class="caption">
        <span class="label">Location Photos</span>
        <span class="title">Sevilla (塞維亞) → Barcelona (巴塞隆納) → Montserrat (蒙塞拉特)</span>
        <span class="meta">Changes every 2 seconds</span>
      </span>
    </section>
  </main>
  <script>
    const dailyPhotos = ["../assets/photos/day08_montserrat_daily_001.jpg","../assets/photos/day08_montserrat_daily_004.jpg","../assets/photos/day08_montserrat_daily_007.jpg","../assets/photos/day08_montserrat_daily_008.jpg","../assets/photos/day08_montserrat_daily_012.jpg","../assets/photos/day08_montserrat_daily_013.jpg","../assets/photos/day08_montserrat_daily_014.jpg","../assets/photos/day08_montserrat_daily_018.jpg","../assets/photos/day08_montserrat_daily_019.jpg","../assets/photos/day08_montserrat_daily_021.jpg","../assets/photos/day08_montserrat_daily_027.jpg","../assets/photos/day08_montserrat_daily_028.jpg","../assets/photos/day08_montserrat_daily_029.jpg","../assets/photos/day08_montserrat_daily_030.jpg"];
    const locationPhotos = ["../assets/photos/day08_montserrat_location_002.jpg","../assets/photos/day08_montserrat_location_003.jpg","../assets/photos/day08_montserrat_location_005.jpg","../assets/photos/day08_montserrat_location_006.jpg","../assets/photos/day08_montserrat_location_009.jpg","../assets/photos/day08_montserrat_location_010.jpg","../assets/photos/day08_montserrat_location_011.jpg","../assets/photos/day08_montserrat_location_015.jpg","../assets/photos/day08_montserrat_location_016.jpg","../assets/photos/day08_montserrat_location_017.jpg","../assets/photos/day08_montserrat_location_020.jpg","../assets/photos/day08_montserrat_location_022.jpg","../assets/photos/day08_montserrat_location_023.jpg","../assets/photos/day08_montserrat_location_024.jpg","../assets/photos/day08_montserrat_location_025.jpg","../assets/photos/day08_montserrat_location_026.jpg","../assets/photos/day08_montserrat_location_031.jpg","../assets/photos/day08_montserrat_location_032.jpg","../assets/photos/day08_montserrat_location_033.jpg"];
    const dailyImage = document.getElementById("dailyPhoto");
    const locationImage = document.getElementById("locationPhoto");
    let dailyIndex = 0;
    let locationIndex = 0;

    function setPhoto(image, list, index) {
      if (!list.length) return index;
      image.src = list[index % list.length];
      return index + 1;
    }

    function rotate() {
      dailyIndex = setPhoto(dailyImage, dailyPhotos, dailyIndex);
      locationIndex = setPhoto(locationImage, locationPhotos, locationIndex);
    }

    rotate();
    window.setInterval(rotate, 2000);
  </script>
</body>
</html>
