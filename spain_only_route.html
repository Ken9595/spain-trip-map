    });

    if (bounds.length) {
      map.fitBounds(bounds, { padding: [28, 28] });
    } else {
      map.setView([39.5, -3.5], 6);
    }

    const legend = L.control({ position: "bottomleft" });
    legend.onAdd = function () {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML = "<strong>Spain Travel Route</strong>" + routes.map(function (route) {
        return '<div class="legend-item"><span class="swatch" style="background:' + route.color + '"></span>' + route.title + '</div>';
      }).join("");
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
