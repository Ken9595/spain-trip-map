  const photoLayer = L.layerGroup().addTo(map_8d8f009ad3ca4ee83e5b6890418e3514);

  function randomPhoto(marker) {
    if (!marker.photos.length) return "";
    return marker.photos[Math.floor(Math.random() * marker.photos.length)];
  }

  function popupHtml(marker, photo) {
    return (
      '<div class="spain-photo-popup">' +
      '<img src="' + photo + '" alt="Spain travel photo">' +
      '<strong>' + marker.title + '</strong>' +
      '<span>' + (marker.kind === "daily" ? "Daily Album / 每日相簿" : "Location Album / 地點相簿") + '</span>' +
      '<span>' + marker.date + '</span>' +
      '<span>' + marker.location + '</span>' +
      '<span>' + marker.photos.length + ' photos, random every 2s</span>' +
      '</div>'
    );
  }

  photoMarkers.forEach(function (marker) {
    let currentPhoto = randomPhoto(marker);
    const icon = L.divIcon({
      className: "spain-photo-marker",
      html: '<div class="spain-photo-pin ' + marker.kind + '"><img src="' + currentPhoto + '" alt=""></div>',
      iconSize: [54, 54],
      iconAnchor: [27, 27],
      popupAnchor: [0, -27]
    });

    const leafletMarker = L.marker([marker.lat, marker.lng], { icon: icon })
      .addTo(photoLayer)
      .bindPopup(popupHtml(marker, currentPhoto), { maxWidth: 300 });

    window.setInterval(function () {
      currentPhoto = randomPhoto(marker);
      leafletMarker.setIcon(L.divIcon({
        className: "spain-photo-marker",
        html: '<div class="spain-photo-pin ' + marker.kind + '"><img src="' + currentPhoto + '" alt=""></div>',
        iconSize: [54, 54],
        iconAnchor: [27, 27],
        popupAnchor: [0, -27]
      }));
      if (leafletMarker.isPopupOpen()) {
        leafletMarker.setPopupContent(popupHtml(marker, currentPhoto));
      }
    }, 2000);
  });

  if (typeof layer_control_3a01e343489e49f9d33d95fc55f184e7 !== "undefined") {
    layer_control_3a01e343489e49f9d33d95fc55f184e7.addOverlay(photoLayer, "Travel Photo Albums");
  }
})();
